[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrodeep"
version = "0.1.0"
description = "Хелперы анализа панели OECD+Китай (макроэкономика, TFP, R&D)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "statsmodels",
  "requests",
  "openpyxl",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "notebooks/deep"]
